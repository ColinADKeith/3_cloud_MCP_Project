<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Career Portal - Application Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 120px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #success-message { display: none; color: green; font-weight: bold; margin-top: 20px; padding: 10px; background-color: #e2f0d9; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Apply for Position</h2>
    <form id="job-app-form" onsubmit="event.preventDefault(); document.getElementById('success-message').style.display='block';">
        <div class="form-group">
            <label for="applicant-name">Full Name</label>
            <input type="text" id="applicant-name" required>
        </div>
        <div class="form-group">
            <label for="applicant-email">Email Address</label>
            <input type="text" id="applicant-email" required>
        </div>
        <div class="form-group">
            <label for="target-position">Target Position</label>
            <input type="text" id="target-position" required>
        </div>
        <div class="form-group">
            <label for="tailored-profile">Professional Summary / Cover Letter Highlight</label>
            <textarea id="tailored-profile" required></textarea>
        </div>
        <button type="submit" id="submit-btn">Submit Application</button>
    </form>

    <div id="success-message">
        🚀 SUCCESS: Application submitted successfully to the corporate recruitment pipeline!
    </div>
</body>
</html>
