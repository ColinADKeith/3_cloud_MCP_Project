name: Weekly Autonomous Job Hunting Matrix

on:
  schedule:
    # 11:00 AM UTC corresponds exactly to 8:00 AM Atlantic Time (AST/ADT) here in Saint John.
    # This alarm goes off every single Sunday morning.
    - cron: '0 11 * * 0'
  workflow_dispatch: # This gives you a physical "Run workflow" button on GitHub to test it anytime!

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: 📑 Check out repository code
      uses: actions/checkout@v4

    - name: 🐍 Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📦 Install Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright beautifulsoup4 oracledb openpyxl streamlit boto3 python-dotenv
        python -m playwright install chromium

    - name: 🤖 Execute Master Automation Orchestrator
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        WALLET_PASSWORD: ${{ secrets.WALLET_PASSWORD }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python src/utils/orchestrator.py

    - name: 💾 Commit and Push Fresh Weekly Excel Sheet
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/qualified_jobs.json data/processed_history.json data/Qualified_Job_Pipeline.xlsx
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated weekly pipeline updates [skip ci]" && git push)